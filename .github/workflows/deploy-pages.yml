name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_AUTHORIZED_EMAILS: ${{ secrets.VITE_ADMIN_AUTHORIZED_EMAILS }}

      # npm run build already runs scripts/prerender.mjs, which writes a real
      # dist/<route>/index.html for every route (so Pages answers 200 instead
      # of 404), plus 404.html, sitemap.xml and robots.txt. Verify rather than
      # trust: a silent prerender failure would cost every route its status.
      - name: Verify prerendered routes
        run: |
          for route in team past-seasons sponsorships; do
            test -f "dist/$route/index.html" || { echo "missing dist/$route/index.html"; exit 1; }
          done
          test -f dist/404.html
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          grep -q 'Sponsor Us' dist/sponsorships/index.html || { echo 'per-route meta not applied'; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
